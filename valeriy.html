<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Валерий — Умный помощник ученика</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --surface: #0d1525;
    --surface2: #111e35;
    --accent: #3d7fff;
    --accent2: #7b4fff;
    --glow: #3d7fff44;
    --text: #c8d8f0;
    --text-dim: #6a86a8;
    --success: #2ecc71;
    --warn: #f39c12;
    --danger: #e74c3c;
    --border: #1e3050;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(61,127,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,127,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 16px;
    animation: slideDown 0.5s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .robot-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 20px var(--glow);
    animation: pulse 3s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px var(--glow); }
    50% { box-shadow: 0 0 35px #3d7fff88; }
  }

  .header-text h1 {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  .header-text p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .status-dot {
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 8px var(--success);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Tab navigation */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 0 15px var(--glow);
  }

  /* Panels */
  .panel { display: none; flex: 1; overflow: hidden; }
  .panel.active { display: flex; flex-direction: column; }

  /* Chat panel */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    scroll-behavior: smooth;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .message {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .message.bot .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .message.user .msg-avatar { background: var(--surface2); }

  .msg-bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }

  .message.bot .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-top-left-radius: 2px;
  }

  .message.user .msg-bubble {
    background: linear-gradient(135deg, #1a3a6e, #1e2d5a);
    border: 1px solid #2a4a8e;
    border-top-right-radius: 2px;
    color: #a8c4ff;
  }

  .msg-bubble strong { color: var(--accent); }

  /* Quick actions */
  .quick-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--surface2);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  .quick-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Exo 2', sans-serif;
  }

  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--glow);
  }

  /* Chat input */
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 16px 16px;
  }

  .chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 15px var(--glow);
  }

  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--glow); }

  /* Homework panel */
  .hw-panel {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }

  .card h2 {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .form-input {
    flex: 1;
    min-width: 120px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text-dim); }

  .btn {
    padding: 9px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 15px var(--glow); }

  .btn-sm {
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 8px;
  }

  .btn-danger { background: linear-gradient(135deg, #c0392b, #e74c3c); }

  .hw-list { display: flex; flex-direction: column; gap: 8px; }

  .hw-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.2s;
    animation: fadeIn 0.3s ease;
  }

  .hw-item:hover { border-color: var(--accent); }
  .hw-item.done { opacity: 0.5; }
  .hw-item.done .hw-task { text-decoration: line-through; }

  .hw-check {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .hw-check.checked {
    background: var(--success);
    border-color: var(--success);
    box-shadow: 0 0 8px #2ecc7144;
  }

  .hw-info { flex: 1; }
  .hw-subject { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .hw-task { font-size: 13px; color: var(--text); margin-top: 2px; }
  .hw-deadline { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .empty-state .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

  /* Tips panel */
  .subjects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .subject-btn {
    padding: 14px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
  }

  .subject-btn:hover {
    border-color: var(--accent);
    background: var(--glow);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px var(--glow);
  }

  .subject-btn .subj-icon { font-size: 24px; display: block; margin-bottom: 6px; }

  .tip-result {
    background: linear-gradient(135deg, #0d1f3c, #0a1830);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 18px;
    font-size: 15px;
    line-height: 1.6;
    box-shadow: 0 0 20px var(--glow);
    animation: fadeIn 0.3s ease;
  }

  /* Plan panel */
  .time-display {
    font-family: 'Orbitron', monospace;
    font-size: 36px;
    font-weight: 700;
    text-align: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .date-display {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 20px;
  }

  .plan-list { display: flex; flex-direction: column; gap: 8px; }

  .plan-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    animation: fadeIn 0.3s ease;
  }

  .priority-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .p-high { background: #3d1515; color: #e74c3c; border: 1px solid #e74c3c44; }
  .p-med { background: #2d2010; color: var(--warn); border: 1px solid #f39c1244; }
  .p-low { background: #0d2d1a; color: var(--success); border: 1px solid #2ecc7144; }

  /* Scrollbar for panels */
  .hw-panel::-webkit-scrollbar { width: 4px; }
  .hw-panel::-webkit-scrollbar-track { background: transparent; }
  .hw-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }

  .typing span {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .app { padding: 12px; }
    .header-text h1 { font-size: 15px; }
    .tab { padding: 7px 12px; font-size: 12px; }
    .msg-bubble { max-width: 88%; }
    .time-display { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="robot-icon">🤖</div>
    <div class="header-text">
      <h1>ВАЛЕРИЙ</h1>
      <p>Умный помощник ученика • Щукин Мартин и Стриганов Тимофей • 8Ф</p>
    </div>
    <div class="status-dot"></div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('chat')">💬 Чат</button>
    <button class="tab" onclick="switchTab('homework')">📚 Домашка</button>
    <button class="tab" onclick="switchTab('tips')">💡 Подсказки</button>
    <button class="tab" onclick="switchTab('plan')">📅 День</button>
  </div>

  <!-- CHAT PANEL -->
  <div class="panel active" id="panel-chat">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('совет')">💡 Совет</button>
      <button class="quick-btn" onclick="quickSend('мотивация')">🌟 Мотивация</button>
      <button class="quick-btn" onclick="quickSend('время')">🕐 Время</button>
      <button class="quick-btn" onclick="quickSend('помощь')">❓ Помощь</button>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" placeholder="Напиши Валерию..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- HOMEWORK PANEL -->
  <div class="panel" id="panel-homework">
    <div class="hw-panel">
      <div class="card">
        <h2>➕ ДОБАВИТЬ ЗАДАНИЕ</h2>
        <div class="form-row">
          <input class="form-input" id="hwSubject" placeholder="Предмет (напр. Математика)">
          <input class="form-input" id="hwDeadline" placeholder="Срок (напр. завтра)">
        </div>
        <div class="form-row">
          <input class="form-input" id="hwTask" placeholder="Что задали?">
          <button class="btn" onclick="addHomework()">Добавить</button>
        </div>
      </div>
      <div class="card">
        <h2>📋 МОИ ЗАДАНИЯ</h2>
        <div class="hw-list" id="hwList">
          <div class="empty-state"><span class="emoji">🎉</span>Заданий нет — отдыхай!</div>
        </div>
      </div>
    </div>
  </div>

  <!-- TIPS PANEL -->
  <div class="panel" id="panel-tips">
    <div class="hw-panel">
      <div class="card">
        <h2>📚 ВЫБЕРИ ПРЕДМЕТ</h2>
        <div class="subjects-grid">
          <button class="subject-btn" onclick="getSubjectTip('математика')"><span class="subj-icon">📐</span>Математика</button>
          <button class="subject-btn" onclick="getSubjectTip('физика')"><span class="subj-icon">⚡</span>Физика</button>
          <button class="subject-btn" onclick="getSubjectTip('химия')"><span class="subj-icon">🧪</span>Химия</button>
          <button class="subject-btn" onclick="getSubjectTip('биология')"><span class="subj-icon">🌿</span>Биология</button>
          <button class="subject-btn" onclick="getSubjectTip('история')"><span class="subj-icon">📜</span>История</button>
          <button class="subject-btn" onclick="getSubjectTip('английский')"><span class="subj-icon">🇬🇧</span>Английский</button>
          <button class="subject-btn" onclick="getSubjectTip('литература')"><span class="subj-icon">📖</span>Литература</button>
          <button class="subject-btn" onclick="getRandomTip()"><span class="subj-icon">🎲</span>Случайный</button>
        </div>
        <div id="tipResult" style="display:none" class="tip-result"></div>
      </div>
    </div>
  </div>

  <!-- PLAN PANEL -->
  <div class="panel" id="panel-plan">
    <div class="hw-panel">
      <div class="card">
        <div class="time-display" id="clockDisplay">00:00</div>
        <div class="date-display" id="dateDisplay"></div>
        <div class="form-row">
          <input class="form-input" id="planTask" placeholder="Добавь задачу на день..." onkeydown="if(event.key==='Enter') addPlanTask()">
          <select class="form-input" id="planPriority" style="max-width:140px;">
            <option value="high">🔴 Срочно</option>
            <option value="med" selected>🟡 Важно</option>
            <option value="low">🟢 Обычное</option>
          </select>
          <button class="btn" onclick="addPlanTask()">+</button>
        </div>
      </div>
      <div class="card">
        <h2>📋 ПЛАН НА ДЕНЬ</h2>
        <div class="plan-list" id="planList">
          <div class="empty-state"><span class="emoji">📝</span>Добавь задачи выше</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ===== DATA =====
const KNOWLEDGE = {
  математика: ["Математика — это логика! Разбей задачу на маленькие шаги.", "Формулы легче запомнить, если понять их смысл, а не просто зубрить.", "Решай похожие задачи — и сложные станут простыми!"],
  физика: ["В физике важно понять явление, а потом уже формулу.", "Нарисуй схему задачи — так намного проще!", "Физика везде вокруг нас. Попробуй найти пример из жизни."],
  история: ["История — это цепочка событий. Ищи причины и следствия.", "Придумай ассоциацию к дате — так она лучше запомнится.", "Составь краткий план по теме — и всё уложится в голове."],
  биология: ["Биология — наука о жизни. Рисуй схемы и таблицы!", "Термины легче учить группами по смыслу.", "Свяжи биологический факт с чем-то знакомым из жизни."],
  химия: ["В химии важна логика валентностей. Не торопись!", "Составляй уравнения реакций по шагам.", "Периодическая таблица — твой лучший друг. Изучи её структуру."],
  английский: ["Читай вслух — так лучше запоминаются слова и произношение.", "Учи слова в контексте предложений, а не списком.", "Смотри видео на английском — это весело и полезно!"],
  литература: ["Не можешь прочитать книгу целиком? Прочти ключевые главы.", "Запиши главную мысль произведения одним предложением.", "Обрати внимание на характеры героев — это основа анализа."]
};

const TIPS = [
  "Сделай домашку — и будет легче!",
  "Попробуй метод Помодоро: 25 минут работы, 5 минут отдыха.",
  "Выпей воды — мозг работает лучше, когда не хочется пить.",
  "Убери телефон на 30 минут и сосредоточься.",
  "Разбей большое задание на маленькие части.",
  "Повтори вчерашний материал — это закрепит знания.",
  "Составь список дел на сегодня и отмечай выполненные.",
  "Проветри комнату перед занятиями — свежий воздух помогает думать.",
  "Не откладывай трудное задание — начни именно с него!",
];

const MOTIVATIONS = [
  "Ты умнее, чем думаешь. Просто начни! 💪",
  "Каждый великий учёный когда-то не понимал это же самое. 🌟",
  "Трудно — значит, ты растёшь. Не останавливайся! 🚀",
  "Один шаг вперёд лучше, чем стоять на месте. 👣",
  "Ошибки — это не провал, это опыт. Продолжай! 🎯",
  "Любой продвинутый школьник может создать инструмент, который облегчит жизнь другим. ✨",
  "Сегодняшние усилия — завтрашние результаты. 📈",
];

let homeworkList = [];
let planList = [];

// ===== CHAT =====
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getResponse(input) {
  const t = input.toLowerCase().trim();
  if (!t) return null;

  if (t.includes('привет') || t === 'hi' || t === 'hello') return "Привет! 👋 Я Валерий, твой помощник. Чем могу помочь?";
  if (t.includes('помощь') || t.includes('команд') || t === '?') return "Вот что я умею:\n• <strong>совет</strong> — полезный совет\n• <strong>мотивация</strong> — мотивирующая фраза\n• <strong>время</strong> — текущее время\n• <strong>математика / физика / химия</strong> и другие предметы — подсказка\n• Или переключись на вкладку <strong>Домашка</strong>, <strong>Подсказки</strong>, <strong>День</strong>!";
  if (t.includes('совет')) return "💡 " + rand(TIPS);
  if (t.includes('мотив') || t.includes('вдохнови')) return "🌟 " + rand(MOTIVATIONS);
  if (t.includes('время') || t.includes('сколько') || t.includes('дата')) {
    const now = new Date();
    const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const months = ['','января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return `🕐 Сейчас <strong>${now.toTimeString().slice(0,5)}</strong>\n📅 ${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()+1]} ${now.getFullYear()}`;
  }
  if (t.includes('пока') || t.includes('до свидания')) return "Пока! Учись хорошо, и всё получится! 👋";
  if (t.includes('спасибо') || t.includes('благодарю')) return "Всегда пожалуйста! 😊 Обращайся!";
  if (t.includes('как дела') || t.includes('как ты')) return "Отлично! Готов помогать тебе учиться 🤖⚡";

  for (const subj of Object.keys(KNOWLEDGE)) {
    if (t.includes(subj)) return "📚 " + rand(KNOWLEDGE[subj]);
  }

  const fallback = [
    "Хм, не совсем понял. Попробуй написать <strong>помощь</strong> для списка команд.",
    "Не знаю такой команды, но я учусь! Напиши <strong>помощь</strong>.",
    "Попробуй спросить про предмет: математика, физика, химия... или напиши <strong>совет</strong>!",
  ];
  return rand(fallback);
}

function addMessage(text, sender) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ' + sender;
  div.innerHTML = `
    <div class="msg-avatar">${sender === 'bot' ? '🤖' : '🧑'}</div>
    <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typingMsg';
  div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  showTyping();
  setTimeout(() => {
    removeTyping();
    const response = getResponse(text);
    addMessage(response || "Не понял тебя 🤔", 'bot');
  }, 600 + Math.random() * 400);
}

function quickSend(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

// ===== HOMEWORK =====
function addHomework() {
  const subject = document.getElementById('hwSubject').value.trim();
  const task = document.getElementById('hwTask').value.trim();
  const deadline = document.getElementById('hwDeadline').value.trim();
  if (!subject || !task) { alert('Заполни предмет и задание!'); return; }
  homeworkList.push({ id: Date.now(), subject, task, deadline: deadline || 'не указан', done: false });
  document.getElementById('hwSubject').value = '';
  document.getElementById('hwTask').value = '';
  document.getElementById('hwDeadline').value = '';
  renderHomework();
}

function toggleHomework(id) {
  const hw = homeworkList.find(h => h.id === id);
  if (hw) { hw.done = !hw.done; renderHomework(); }
}

function deleteHomework(id) {
  homeworkList = homeworkList.filter(h => h.id !== id);
  renderHomework();
}

function renderHomework() {
  const list = document.getElementById('hwList');
  if (!homeworkList.length) {
    list.innerHTML = '<div class="empty-state"><span class="emoji">🎉</span>Заданий нет — отдыхай!</div>';
    return;
  }
  list.innerHTML = homeworkList.map(hw => `
    <div class="hw-item ${hw.done ? 'done' : ''}">
      <div class="hw-check ${hw.done ? 'checked' : ''}" onclick="toggleHomework(${hw.id})">${hw.done ? '✓' : ''}</div>
      <div class="hw-info">
        <div class="hw-subject">${hw.subject}</div>
        <div class="hw-task">${hw.task}</div>
        <div class="hw-deadline">📅 ${hw.deadline}</div>
      </div>
      <button class="btn btn-sm btn-danger" onclick="deleteHomework(${hw.id})">✕</button>
    </div>
  `).join('');
}

// ===== TIPS =====
function getSubjectTip(subj) {
  const tips = KNOWLEDGE[subj];
  if (!tips) return;
  const el = document.getElementById('tipResult');
  el.style.display = 'block';
  el.innerHTML = `<strong>${subj.charAt(0).toUpperCase() + subj.slice(1)}:</strong><br><br>${rand(tips)}`;
}

function getRandomTip() {
  const subjs = Object.keys(KNOWLEDGE);
  const subj = rand(subjs);
  const el = document.getElementById('tipResult');
  el.style.display = 'block';
  el.innerHTML = `<strong>${subj.charAt(0).toUpperCase() + subj.slice(1)}:</strong><br><br>${rand(KNOWLEDGE[subj])}`;
}

// ===== PLAN =====
function addPlanTask() {
  const taskEl = document.getElementById('planTask');
  const task = taskEl.value.trim();
  const priority = document.getElementById('planPriority').value;
  if (!task) return;
  planList.push({ id: Date.now(), task, priority });
  taskEl.value = '';
  renderPlan();
}

function deletePlanTask(id) {
  planList = planList.filter(p => p.id !== id);
  renderPlan();
}

function renderPlan() {
  const list = document.getElementById('planList');
  if (!planList.length) {
    list.innerHTML = '<div class="empty-state"><span class="emoji">📝</span>Добавь задачи выше</div>';
    return;
  }
  const labels = { high: ['🔴 Срочно', 'p-high'], med: ['🟡 Важно', 'p-med'], low: ['🟢 Обычное', 'p-low'] };
  list.innerHTML = planList.map(p => `
    <div class="plan-item">
      <span class="priority-badge ${labels[p.priority][1]}">${labels[p.priority][0]}</span>
      <span style="flex:1;font-size:14px">${p.task}</span>
      <button class="btn btn-sm btn-danger" onclick="deletePlanTask(${p.id})">✕</button>
    </div>
  `).join('');
}

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent = now.toTimeString().slice(0, 5);
  const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const months = ['','января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  document.getElementById('dateDisplay').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()+1]} ${now.getFullYear()}`;
}

// ===== TABS =====
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['chat','homework','tips','plan'][i] === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
}

// ===== INIT =====
updateClock();
setInterval(updateClock, 1000);

// Welcome message
setTimeout(() => {
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Доброе утро' : hour < 17 ? 'Добрый день' : 'Добрый вечер';
  addMessage(`${greet}! 👋 Я <strong>Валерий</strong> — твой умный помощник.\n\nЯ помогу с учёбой, напомню о заданиях и поддержу в трудный момент.\n\nНапиши <strong>помощь</strong> — покажу все команды!`, 'bot');
}, 300);
</script>
</body>
